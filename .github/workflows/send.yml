name: send

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: send
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.send.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "google-auth[requests]==2.59.1" "requests==2.32.5"
      - name: Send
        id: send
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER_2: ${{ secrets.GMAIL_USER_2 }}
          GMAIL_APP_PASSWORD_2: ${{ secrets.GMAIL_APP_PASSWORD_2 }}
          DAILY_2: ${{ vars.DAILY_2 || '450' }}
          GMAIL_USER_3: ${{ secrets.GMAIL_USER_3 }}
          GMAIL_APP_PASSWORD_3: ${{ secrets.GMAIL_APP_PASSWORD_3 }}
          DAILY_3: ${{ vars.DAILY_3 || '450' }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEETS_KEY_JSON: ${{ secrets.SHEETS_KEY_JSON }}
          DAILY: "450"
          PER_RUN: "3"
          GAP_MIN: "25"
          GAP_MAX: "50"
        run: |
          umask 077
          printf '%s' "$SHEETS_KEY_JSON" > "$RUNNER_TEMP/key.json"
          set +e
          SHEETS_KEY_FILE="$RUNNER_TEMP/key.json" python send.py
          code=$?
          rm -f "$RUNNER_TEMP/key.json"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case $code in 0|3) exit 0 ;; *) exit $code ;; esac

  # Cron on a new repository can stay silent for hours, so every run queues the next one itself:
  # sent -> 30 s, idle or nothing went out -> 15 min, crash -> 5 min, bounce stop (2) or a manual cancel -> no next run.
  # Its own job, so the actions:write token never meets the third-party packages installed above.
  next:
    needs: send
    if: ${{ !cancelled() && needs.send.outputs.code != '2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ needs.send.outputs.code }}
        run: |
          case "$CODE" in 0) sleep 30 ;; 3) sleep 900 ;; *) sleep 300 ;; esac
          gh workflow run send.yml --ref "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
